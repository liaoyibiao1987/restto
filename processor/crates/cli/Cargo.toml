[package]
name = "rustto-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "rustto-client"
path = "src/main.rs"

[dependencies]
rustto-core = { path = "../core" }
rustto-common = { path = "../common" }
rustto-tools = { path = "../tools" }
tokio = { version = "1", features = ["full"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
base64 = "0.22"
