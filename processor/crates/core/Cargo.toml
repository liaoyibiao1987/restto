[package]
name = "rustto-core"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
tokio = { version = "1", features = ["io-util", "net", "macros", "rt", "time", "fs"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dotenvy = "0.15"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
thiserror = "1"
