[package]
name = "rustto-modules"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
rustto-core = { path = "../core" }
tokio = { version = "1", features = ["fs", "io-util", "process", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
thiserror = "1"
