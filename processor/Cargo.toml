[workspace]
members = [
    "crates/core",
    "crates/common",
    "crates/backup-file",
    "crates/backup-mysql",
    "crates/tools",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["rustto"]
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
